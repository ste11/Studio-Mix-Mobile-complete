<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="metalFader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Left Deck (Cyan) Vinyl / Jog ring -->
  <g transform="translate(148, 175)">
    <circle r="92" fill="#18181b" stroke="#27272a" stroke-width="4" />
    <circle r="72" fill="#09090b" stroke="#06b6d4" stroke-width="3" stroke-dasharray="16 8" />
    <circle r="48" fill="#18181b" stroke="#22d3ee" stroke-width="4" />
    <circle r="18" fill="#06b6d4" />
    <circle r="6" fill="#09090b" />
  </g>

  <!-- Right Deck (Amber) Vinyl / Jog ring -->
  <g transform="translate(364, 175)">
    <circle r="92" fill="#18181b" stroke="#27272a" stroke-width="4" />
    <circle r="72" fill="#09090b" stroke="#f59e0b" stroke-width="3" stroke-dasharray="16 8" />
    <circle r="48" fill="#18181b" stroke="#fbbf24" stroke-width="4" />
    <circle r="18" fill="#f59e0b" />
    <circle r="6" fill="#09090b" />
  </g>

  <!-- Center Equalizer bars -->
  <g transform="translate(226, 120)">
    <!-- Bar 1 -->
    <rect x="0" y="55" width="10" height="40" rx="3" fill="#22d3ee" />
    <!-- Bar 2 -->
    <rect x="18" y="25" width="10" height="70" rx="3" fill="#38bdf8" />
    <!-- Bar 3 -->
    <rect x="36" y="40" width="10" height="55" rx="3" fill="#fbbf24" />
    <!-- Bar 4 -->
    <rect x="54" y="60" width="10" height="35" rx="3" fill="#f59e0b" />
  </g>

  <!-- Crossfader Section -->
  <g transform="translate(86, 335)">
    <!-- Rail -->
    <rect x="0" y="25" width="340" height="14" rx="7" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <!-- Center Marker -->
    <line x1="170" y1="12" x2="170" y2="52" stroke="#71717a" stroke-width="3" stroke-linecap="round" />
    <!-- Fader Cap -->
    <rect x="142" y="6" width="56" height="52" rx="8" fill="url(#metalFader)" stroke="#71717a" stroke-width="2" />
    <rect x="167" y="12" width="6" height="40" rx="2" fill="#22d3ee" />
  </g>

  <!-- Soundwave / LED indicator at bottom -->
  <g transform="translate(136, 425)">
    <rect x="0" y="8" width="14" height="24" rx="3" fill="#22d3ee" />
    <rect x="22" y="2" width="14" height="36" rx="3" fill="#22d3ee" />
    <rect x="44" y="12" width="14" height="16" rx="3" fill="#22d3ee" />
    <rect x="66" y="0" width="14" height="40" rx="3" fill="#06b6d4" />
    <rect x="88" y="6" width="14" height="28" rx="3" fill="#10b981" />
    <rect x="110" y="10" width="14" height="20" rx="3" fill="#10b981" />
    <rect x="132" y="6" width="14" height="28" rx="3" fill="#fbbf24" />
    <rect x="154" y="2" width="14" height="36" rx="3" fill="#f59e0b" />
    <rect x="176" y="8" width="14" height="24" rx="3" fill="#f59e0b" />
    <rect x="198" y="14" width="14" height="12" rx="3" fill="#ef4444" />
    <rect x="220" y="4" width="14" height="32" rx="3" fill="#ef4444" />
  </g>
</svg>
